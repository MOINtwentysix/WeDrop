<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7f2" />
    <title>Offline · WeDrop</title>
    <style>
      body {
        background: #f6f7f2;
        color: #26352b;
        font:
          15px Arial,
          sans-serif;
        max-width: 650px;
        margin: 10vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 56px;
        letter-spacing: -3px;
      }
      p {
        color: #788078;
        line-height: 1.7;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 280px;
        border: 1px solid #dce1d5;
        border-radius: 14px;
        padding: 20px;
        font: 14px/1.8 monospace;
        resize: vertical;
      }
      a {
        display: inline-block;
        background: #d7f279;
        padding: 13px 20px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <strong>↓ WeDrop</strong>
    <h1>A little offline.</h1>
    <p>
      You can write here while you’re offline. Copy your text before
      reconnecting; this temporary editor does not save it. Creating and opening
      drops requires a connection.
    </p>
    <label for="draft">Your text or code</label>
    <p>
      <textarea id="draft" placeholder="Keep your thought here…"></textarea>
    </p>
    <a href="/">Reconnect to WeDrop ↗</a>
  </body>
</html>
